# docker-compose.yml

services:
  postgres:
    image: postgres:13
    # Имя контейнера динамически подтягивается из вашей переменной в .env
    container_name: ${CONTAINER_NAME_BASE}
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      # Пробрасываем стандартный порт наружу на ваш компьютер, до 5439 у меня заняты другими контейнерами
      - "5440:5432" 
    volumes:
      - pgdata:/var/lib/postgresql/data/pgdata
    networks:
      - pgnetwork
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .

    container_name: ${CONTAINER_NAME_APP}
    restart: always
    ports:
      # Обязательный проброс портов для доступа к Swagger UI (http://localhost:8000/docs)
      - "8000:8000"
    env_file:
      - .env

    environment:
       
      # база доступна по имени сервиса 'postgres', а не через 'localhost'.
      POSTGRES_HOST: postgres  
    volumes:
      - ./logfile.log:/code/logfile.log
    networks:
      - pgnetwork
    depends_on:
      postgres:
        condition: service_healthy  # Ждем, пока отработает healthcheck базы данных

networks:
  pgnetwork:

volumes:
  pgdata:
